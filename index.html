<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Suivi des finances du foyer. Tout reste sur ton appareil." />
    <meta name="theme-color" content="#F0F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2F5D4C" media="(prefers-color-scheme: dark)" />
    <title>Tout compte fait</title>
    <script>
      // Applique le thème avant le premier rendu. Le document de données vit en
      // IndexedDB (asynchrone) : sans ce miroir localStorage, l'app s'afficherait
      // une frame en clair avant de basculer.
      ;(function () {
        try {
          var pref = localStorage.getItem('tout-compte-fait.theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

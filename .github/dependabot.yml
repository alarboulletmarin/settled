version: 2

updates:
  # Les dépendances npm. Regroupées en deux PR par mois plutôt qu'une par
  # paquet : sur un projet à un mainteneur, quinze PR de bump se ferment sans
  # être lues, ce qui revient à ne pas suivre les mises à jour du tout.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'Mettre à jour'
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      developpement:
        dependency-type: development
        update-types: [minor, patch]
    # Les majeures restent individuelles : elles se lisent une par une, avec
    # leur note de version.

  # Les actions GitHub utilisées par la CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'Mettre à jour'
    groups:
      actions:
        patterns: ['*']

name: 🐛 Bug
description: Signaler quelque chose qui ne marche pas comme annoncé
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps. C'est la contribution la plus utile au projet.

        ⚠️ **N'attache jamais ton fichier de données exporté** : il contient tes
        revenus, tes crédits et le nom des gens de ton foyer. Si le bug ne se
        reproduit qu'avec des données particulières, décris leur *forme* — « une
        récurrence mensuelle au 31 à montant variable » — ou reproduis-le sur le
        jeu d'exemple (Réglages → Charger l'exemple).

        🔒 Pour une **faille de sécurité**, n'utilise pas ce formulaire :
        [signale-la en privé](https://github.com/alarboulletmarin/tout-compte-fait/security/advisories/new).

  - type: textarea
    id: attendu-obtenu
    attributes:
      label: Ce qui devait se passer, et ce qui s'est passé
      description: Les deux dans l'ordre. C'est souvent la seule chose qui compte.
      placeholder: |
        J'attendais que le solde du mois passe à 1 240 €.
        Il est resté à 0 €.
    validations:
      required: true

  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      description: Étape par étape, depuis un état connu.
      placeholder: |
        1. Charger le jeu d'exemple
        2. Aller sur le mois de mars
        3. Confirmer l'échéance « Loyer »
        4. Revenir sur février puis sur mars
    validations:
      required: true

  - type: dropdown
    id: ecran
    attributes:
      label: Sur quel écran
      options:
        - Le mois
        - Calendrier
        - Récurrences
        - Historique
        - Réglages
        - Crédits
        - Répartition
        - Épargne
        - Saisie d'une dépense ou d'une recette
        - Première ouverture (bienvenue, démarrer)
        - Ailleurs, ou partout
    validations:
      required: true

  - type: input
    id: navigateur
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 145 sur Android 16 — Pixel 8
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Thème
      options:
        - Clair
        - Sombre
        - Les deux
        - Sans rapport
    validations:
      required: false

  - type: textarea
    id: captures
    attributes:
      label: Captures ou messages d'erreur
      description: |
        Une capture si c'est visuel. Si la console du navigateur affiche une
        erreur (F12 → Console), colle-la — mais relis-la d'abord, elle peut
        contenir des libellés de ton foyer.
    validations:
      required: false

  - type: checkboxes
    id: verifications
    attributes:
      label: Avant d'envoyer
      options:
        - label: J'ai vérifié qu'aucune issue ouverte ne décrit déjà ce bug
          required: true
        - label: Je n'ai joint aucune donnée personnelle ni fichier d'export
          required: true
